name: wiki-sync

# 위키의 원본은 이 리포의 dev 브랜치다. 이 워크플로는 세 가지를 한다:
#  1) 위키 빌더 루틴이 S3 wiki-outbox/ 에 올려둔 갱신분을 dev 에 커밋 (루틴은
#     GitHub 에 직접 쓸 수 없음 — 2026-08-04 실측 3회)
#  2) dev 의 wiki/ 를 S3 wiki/ 로 역동기화 (퀴즈 루틴 등 S3 소비자용 읽기 캐시)
#  3) 반영된 outbox 비우기
# 사람 편집은 dev 에 직접 커밋/PR — outbox 파일 외에는 덮어써지지 않는다.
# schedule 은 기본 브랜치 워크플로만 발화하므로 이 파일은 main 에 둔다.

on:
  schedule:
    - cron: "30 22 * * 1,4"   # 화·금 07:30 KST — 위키 빌더(06:00 KST) 이후
  workflow_dispatch: {}

permissions:
  id-token: write   # AWS OIDC (무키)
  contents: write   # dev 커밋

env:
  S3_BUCKET: victoryfairy-crawl-local   # dev 전환 시 victoryfairy-crawl-dev 로 교체

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::555209622409:role/vf-wiki-mirror-gha
          aws-region: ap-northeast-2

      - name: Apply builder outbox (S3 -> dev)
        id: outbox
        run: |
          mkdir -p /tmp/outbox
          aws s3 sync "s3://${S3_BUCKET}/wiki-outbox/" /tmp/outbox/
          if [ -z "$(ls -A /tmp/outbox 2>/dev/null)" ]; then
            echo "outbox empty"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rsync -a /tmp/outbox/ wiki/
          git add -A wiki/
          if git diff --cached --quiet; then
            echo "outbox had no effective changes"
          else
            git config user.name "vf-wiki-sync"
            git config user.email "actions@github.com"
            git commit -m "wiki: apply builder outbox $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin dev
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Export wiki (dev -> S3 read cache)
        run: aws s3 sync wiki/ "s3://${S3_BUCKET}/wiki/" --delete

      - name: Clear outbox
        if: steps.outbox.outputs.applied == 'true'
        run: aws s3 rm "s3://${S3_BUCKET}/wiki-outbox/" --recursive
